<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <circle cx="140" cy="270" r="240" fill="url(#glowL)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="60" r="260" fill="url(#glowR)">
    <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect width="420" height="320" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="translate" from="-420 0" to="1280 0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#f4f7fb" letter-spacing="6">EMRAH AYDIN</text>

  <rect x="490" y="192" width="300" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;300;300;300" keyTimes="0;0.25;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="640;490;490;490" keyTimes="0;0.25;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.25;0.9;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#7dd3fc" letter-spacing="10">E N T R E P R E N E U R</text>
</svg>
